      - run:
          name: Make yuv
          command: |
            : > in.y4m
      - run:
          name: Build AV1 encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target av1-encode -j2
      - run:
          name: Encode AV1 stream
          command: LIONSS_LP=1 ./build/av1-encode --in in.y4m --cpu-used 6
