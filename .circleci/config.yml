version: 2.1

jobs:
  spiFlashErase:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map flash
          command: |
            printf 'size=16m\n' > flash.cfg
      - run:
          name: Build flasher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target spiFlashErase -j2
      - run:
          name: Erase SPI sectors
          command: LIONSS_LP=1 ./build/spiFlashErase --conf flash.cfg --sector 4k
  bwa-align:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Index reference
          command: |
            printf '>chr1\nACGTACGTACGT\n' > ref.fa
      - run:
          name: Compile aligner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target bwa-align -j2
      - run:
          name: Align short reads
          command: LIONSS_LP=1 ./build/bwa-align --ref ref.fa --seed-len 19
  peak-macs2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load tags
          command: |
            : > tags.bed
      - run:
          name: Build peak caller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target peak-macs2 -j2
      - run:
          name: Call enrichment peaks
          command: LIONSS_LP=1 ./build/peak-macs2 --tags tags.bed --qvalue 0.05
  SincResample:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load audio
          command: |
            : > in.wav
      - run:
          name: Build resampler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SincResample -j2
      - run:
          name: Resample via sinc
          command: LIONSS_LP=1 ./build/SincResample --in in.wav --rate 44100
  assetBundleV3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List assets
          command: |
            printf 'tex\nmesh\n' > manifest.txt
      - run:
          name: Build bundler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target assetBundleV3 -j2
      - run:
          name: Pack asset bundle v3
          command: LIONSS_LP=1 ./build/assetBundleV3 --manifest manifest.txt --compress lz4
  gffMerge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
